services:
  - type: web
    name: docs-app-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false # set manually in the Render dashboard: CockroachDB Cloud connection string
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # set to the deployed Vercel frontend URL
      - key: COOKIE_SECURE
        value: "true"
